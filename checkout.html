<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">


  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout - F1 Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      background-color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      color: #000000;
    }
</style>


</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #e10600;">
  <div class="container">
    <a class="navbar-brand" href="index.html">

        <img src="images/f1.png" alt="F1 75 Logo" style="height: 50px; width: auto;">

    </a>
  </div>
</nav>

<div class="container my-5">
  <h2>Checkout</h2>
  <form onsubmit="handleSubmit(event)">
    <div class="row mb-3">
      <div class="col">
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" class="form-control" id="firstName" required />
      </div>
      <div class="col">
        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="lastName" required />
      </div>
    </div>
    <div class="mb-3">
      <label for="address" class="form-label">Shipping Address</label>
      <input type="text" class="form-control" id="address" required />
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email Address</label>
      <input type="email" class="form-control" id="email" required />
    </div>
    <div class="mb-3">
      <label for="card" class="form-label">Credit Card Number</label>
      <input type="text" class="form-control" id="card" required />
    </div>
    <button type="submit" class="btn btn-primary">Place Order</button>
  </form>
</div>

<script>
  function handleSubmit(e) {
    e.preventDefault();
    alert("Order placed successfully! (Mock checkout)");
    localStorage.removeItem("cart");
    window.location.href = "index.html";
  }
</script>

</body>
</html>
