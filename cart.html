<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart - F1 Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

<style>
    body {
      background-color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      color: #000000;
    }
</style>



</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #e10600;">
  <div class="container">
    <a class="navbar-brand" href="index.html">
        <img src="images/f1.png" alt="F1 75 Logo" style="height: 50px; width: auto;">
    </a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="alpine.html">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="checkout.html">Checkout</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container my-5">
  <h2>Your Cart</h2>
  <table class="table table-striped" id="cartTable">
    <thead>
      <tr>
        <th>Product</th>
        <th>Price</th>
        <th>Qty</th>
        <th>Total</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <h4 id="cartTotal">Total: $0.00</h4>
  <a href="checkout.html" class="btn btn-success mt-3">Proceed to Checkout</a>
</div>

<script>
  const cartTable = document.querySelector("#cartTable tbody");
  const cartTotal = document.getElementById("cartTotal");

  function renderCart() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    cartTable.innerHTML = "";
    let total = 0;

    cart.forEach((item, index) => {
      const itemTotal = item.price * item.quantity;
      total += itemTotal;

      const row = `
        <tr>
          <td>${item.name}</td>
          <td>$${item.price.toFixed(2)}</td>
          <td>${item.quantity}</td>
          <td>$${itemTotal.toFixed(2)}</td>
          <td><button class="btn btn-danger btn-sm" onclick="removeItem(${index})">Remove</button></td>
        </tr>`;
      cartTable.innerHTML += row;
    });

    cartTotal.textContent = "Total: $" + total.toFixed(2);
  }

  function removeItem(index) {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
  }

  renderCart();
</script>

</body>
</html>
